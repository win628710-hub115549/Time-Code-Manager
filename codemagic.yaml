workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Initialize Flutter Project
        script: |
          if [ ! -d "android" ]; then
            flutter create . --org com.timecode.manager --project-name time_code_manager --platforms android
          fi
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
