workflows:
  default-workflow:
    name: Web Build Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Force create web support and get dependencies
        script: |
          flutter config --enable-web
          flutter create . --platforms=web
          flutter pub get
      - name: Build Web Release
        script: |
          flutter build web --release
    artifacts:
      - build/web/**
